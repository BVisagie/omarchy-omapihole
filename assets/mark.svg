<?xml version="1.0" encoding="UTF-8"?>
<!--
  OmaPihole mark. Original work, MIT like the rest of this repo.

  A heater shield with a stadium slot punched through its chest, and a knob
  sitting in that slot. The shield is the block, the slot is the Omarchy bar
  pill and the "hole", the knob is the one daily action: pause / resume.
  Knob right = blocking on. In the bar the knob slides left while the hole
  is open (paused or disabled); this static file shows the on position.

  One filled silhouette (fill-rule evenodd) so it stays legible on the bar's
  16px canvas and tints with whatever the theme hands it via currentColor.

  Grid: 24x24, absolute M/L/C/Z only, no arcs, so the same path string can be
  scaled by multiplying every number. OmaPiholeIcon.qml carries these exact
  numbers; keep them in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <path fill-rule="evenodd" d="M5.5 3 L18.5 3 C19.328 3 20 3.672 20 4.5 L20 11.5 C20 16 17 19.6 12 21.5 C7 19.6 4 16 4 11.5 L4 4.5 C4 3.672 4.672 3 5.5 3 Z M9 7.5 L15 7.5 C16.381 7.5 17.5 8.619 17.5 10 C17.5 11.381 16.381 12.5 15 12.5 L9 12.5 C7.619 12.5 6.5 11.381 6.5 10 C6.5 8.619 7.619 7.5 9 7.5 Z"/>
  <circle cx="15" cy="10" r="1.75"/>
</svg>
