name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Manifest
        run: python3 -c "import json; m=json.load(open('manifest.json')); assert m['id']=='bvisagie.omapihole' and m['schemaVersion']==1"

      - name: Helper tests
        run: python3 -m unittest discover -s tests -v

      - name: Model tests
        run: node --test tests/test_model.js

      - name: Helper compiles
        run: python3 -m py_compile scripts/omapihole
